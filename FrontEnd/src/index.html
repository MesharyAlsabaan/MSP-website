<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>MSP | Architecture &amp; Engineering Consultancy</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f4ee" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#14110d" media="(prefers-color-scheme: dark)">
  <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32.png">
  <link rel="apple-touch-icon" href="/images/apple-touch-icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap"
    rel="stylesheet">

  <!-- Apply the saved theme + language before first paint to avoid a flash. -->
  <script>
    (function () {
      try {
        var stored = localStorage.getItem('msp-theme');
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        var dark = stored ? stored === 'dark' : prefersDark;
        if (dark) document.documentElement.classList.add('dark');
      } catch (e) {}
      // Language comes from the URL (/ar/... = Arabic). Prerendered pages
      // already carry it; this covers the client-rendered app shell.
      var ar = /^\/ar(\/|$)/.test(location.pathname);
      document.documentElement.setAttribute('lang', ar ? 'ar' : 'en');
      document.documentElement.setAttribute('dir', ar ? 'rtl' : 'ltr');
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
